name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  image:
    runs-on: ubuntu-latest
    # NOTE(sg): We set continue-on-error=true so that one failing version
    # doesn't cancel all other builds. We've observed that builds can get
    # cancelled while they're pushing the built image to quay.io which can
    # have side-effects such as the per-build tag not being created (which in
    # turn then triggers quay.io to garbage collect the build's layers when a
    # new version is built).
    continue-on-error: true
    strategy:
      matrix:
        oc:
          - "4.12"
          - "4.13"
          - "4.14"
          - "4.15"
          - "4.16"
          - "4.17"
          - "4.18"
          - "4.19"
          - "4.20"
          - "4.21"
          - "4.22"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Login to quay.io
        uses: docker/login-action@v4
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Docker build
        uses: docker/build-push-action@v7
        with:
          context: "v${{ matrix.oc }}"
          file: "v${{ matrix.oc }}/Dockerfile"
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            quay.io/appuio/oc:v${{ matrix.oc }}-${{ github.run_number }}.${{ github.run_attempt }}
            quay.io/appuio/oc:v${{ matrix.oc }}
            docker.io/appuio/oc:v${{ matrix.oc }}
